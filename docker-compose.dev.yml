services:
  # # Temporary setup container to build the folder structure
  # init-folders:
  #   image: alpine
  #   container_name: bricktracker-init
  #   volumes:
  #     - ./bricktracker/:/app/data:rw
  #   command: sh -c "mkdir -p /app/data/sets /app/data/parts /app/data/minifigs /app/data/instructions"
         
  bricktracker:
    image: gitea.baerentsen.space/frederikbaerentsen/bricktracker:latest
    container_name: bricktracker
    ports:
      - "3333:3333"
    environment:
      - BK_REBRICKABLE_API_KEY=$BK_REBRICKABLE_API_KEY
    # depends_on:
    #   init-folders:
    #     condition: service_completed_successfully
    volumes:
      - ./bricktracker/:/app/data:rw  # v1.3+ consolidates everything into /app/data
    restart: unless-stopped
               
  legoscanner:
    build: 
      context: ./legoscanner/
      dockerfile: DockerFile
    container_name: legoscanner
    volumes:
      - ./legoscanner/:/workspaces/legoscanner/:rw # Mounts your code
      - ./bricktracker/:/workspaces/legoscanner/bricktracker/:rw
      - ./ssh/:/root/.ssh:rw
    environment:
      - CAMERA_API=$CAMERA_API
      - BRICKTRACKER_DB=$BRICKTRACKER_DB
      - IMAGE_FOLDER=$IMAGE_FOLDER
    # depends_on:
    #   init-folders:
    #     condition: service_completed_successfully
    ports:
      - "8501:8501"
      - "8888:8888"

  dbgate_legoscanner:
    image: dbgate/dbgate:latest
    container_name: dbgate_legoscanner
    restart: unless-stopped
    ports:
      - "3004:3000"
    volumes:
      # Mount your database folder so DbGate can read it
      - ./bricktracker/:/root/datadir/sqlite_files
    environment:
      - DEV_MODE=false